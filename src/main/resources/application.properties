# =====================================================================
# PrestaControl - configuracion 100% por variables de entorno
# =====================================================================
spring.application.name=prestamoservice

# Puerto de escucha (Render inyecta PORT; Dockerfile define 8080 por defecto)
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ---------------------------------------------------------------------
# PostgreSQL
# DB_URL ejemplo: jdbc:postgresql://localhost:5432/prestamoservice
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------
# JSON
# ---------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------
# JWT
# JWT_SECRET debe tener al menos 32 caracteres (256 bits para HS256)
# JWT_EXPIRATION se expresa en milisegundos (ej. 86400000 = 24 horas)
# ---------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
